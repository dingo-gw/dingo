################################################################################
##  Job submission arguments
################################################################################

local = True
#accounting = ligo.dev.o4.cbc.pe.dingo
request-cpus-importance-sampling = 64
sampling-requirements = [TARGET.CUDAGlobalMemoryMb>40000]
# extra-lines = [+WantsGPUNode = True]


################################################################################
##  Sampler arguments
################################################################################

model = training/model_latest.pt
device = cuda
num-samples = 50000
batch-size = 50000
recover-log-prob = true
prior-dict-updates = {
luminosity_distance = bilby.gw.prior.UniformComovingVolume(minimum=100, maximum=2000, name='luminosity_distance'),
}


################################################################################
## Data generation arguments
################################################################################

trigger-time = GW150914
label = GW150914
outdir = outdir_GW150914
channel-dict = {H1:GWOSC, L1:GWOSC, V1:GWOSC}
psd-length = 128


################################################################################
## Inference-time frequency options (transformer / dingo-t1 specific)
##
## These options adjust which frequency bins the transformer attends to at
## inference time.  They do not require retraining the model — they mask out
## the corresponding tokens before the forward pass.
################################################################################

# --- Per-detector frequency range ---
#
# Restrict the frequency band used at inference.  Both flags accept either a
# single float (applied to all detectors) or a per-detector dict.
# Detectors absent from the dict fall back to the model's training range.
# The model must have been trained with mask_frequency_edges augmentation for
# a non-default range to be in-distribution.
#
minimum-frequency = {H1: 20, L1: 20, V1: 20}
maximum-frequency = {H1: 1024, L1: 1024, V1: 1024}


# --- PSD notching ---
#
# Suppress specific frequency intervals that are contaminated by, e.g.,
# power-line harmonics or spectral artefacts.  Two equivalent paths lead to
# the same result:
#
# Standard path (set the flag below):
#   dingo_pipe sets ASD = 1 in the specified bins during data generation and
#   saves it to the event HDF5.  At sampling time the notched bins are
#   auto-detected from the stored ASD and the overlapping tokens are masked.
#   At importance-sampling time the ASD = 1 bins contribute negligibly to the
#   noise-weighted inner product (ASD = 1 >> typical noise ASD ~ 1e-23 1/rtHz).
#
# Asimov / pre-notched path (leave the flag commented out):
#   If the ASD has already been set to 1 in the notch regions by an external
#   tool (e.g. the Asimov pipeline) before dingo_pipe runs, the notches are
#   detected automatically from the stored ASD.  No ini flag is needed.
#
# Format: per-detector dict.  Each value is either a single interval
#   [f_lo, f_hi] or a list of intervals [[f_lo1, f_hi1], [f_lo2, f_hi2], ...].
# Units: Hz.
#
psd-notch-dict = {H1: [[59.0, 61.0], [119.0, 121.0]], L1: [59.0, 61.0], V1: [49.0, 51.0]}


################################################################################
## Plotting arguments
################################################################################

plot-corner = true
plot-weights = true
plot-log-probs = true
