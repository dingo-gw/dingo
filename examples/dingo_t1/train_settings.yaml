data:
  waveform_dataset_path: /01_waveform_dataset/waveform_dataset.hdf5
  train_fraction: 0.95
  detectors:
    - H1
    - L1
    - V1
  extrinsic_prior:
    dec: default
    ra: default
    geocent_time: bilby.core.prior.Uniform(minimum=-0.1, maximum=0.1)
    psi: default
    luminosity_distance: bilby.core.prior.Uniform(minimum=100.0, maximum=6000.0) #Mpc
  ref_time: 1126259462.391
  inference_parameters:
    - chirp_mass
    - mass_ratio
    - a_1
    - a_2
    - tilt_1
    - tilt_2
    - phi_12
    - phi_jl
    - theta_jn
    - luminosity_distance
    - geocent_time
    - ra
    - dec
    - psi
  tokenization:
    token_size: 16
    normalize_position: true
    mask_detectors:
      p_num_masked: [0.6, 0.3, 0.1]
      p_detector:
        H1: 0.3
        L1: 0.3
        V1: 0.4
    mask_frequency_range:
      p_mask: 0.2
      f_min_upper: 100.0
      f_max_lower: 800.0
      p_lower_upper_both: [0.4, 0.4, 0.2]
      p_same_all_detectors: 0.7
    mask_frequency_notches:
      p_per_detector: 0.3
      max_width: 10.0
      # Optionally restrict where notches are drawn (default: the whole domain):
      # f_min: 20.0
      # f_max: 1800.0
#    mask_random_tokens:
#      p_mask: 0.2
#      max_num_tokens: 10

model:
  posterior_model_type: normalizing_flow
  posterior_kwargs:
    num_flow_steps: 30
    base_transform_kwargs:
      hidden_dim: 512
      num_transform_blocks: 5
      activation: elu
      norm: LayerNorm
      dropout_probability: 0.0
      num_bins: 8
      base_transform_type: rq-coupling
  embedding_type: transformer
  embedding_kwargs:
    tokenizer_kwargs:
      hidden_dims: [ 512,]
      activation: elu
      norm: LayerNorm
    transformer_kwargs:
      d_model: 1024
      dim_feedforward: 2048
      nhead: 16
      dropout: 0.0
      num_layers: 8
      norm_first: True
    pooling: cls
    final_net_kwargs:  # linear projection to the flow context (no activation)
      output_dim: 128

training:
  stage_0:
    epochs: 300
    asd_dataset_path: /02_asd_dataset/asds_O3.hdf5
    optimizer:
      type: adamw
      lr: 0.0001
      betas:
      - 0.8
      - 0.99
      weight_decay: 0.005
    scheduler:
      type: reduce_on_plateau
      mode: min
      factor: 0.5
      patience: 10
    early_stopping:
      patience: 30 # This patience has to be larger than the ReduceLROnPlateau patience
      delta: 0.0
      metric: validation # one of ['training, validation']
    automatic_mixed_precision: True
    gradient_updates_per_optimizer_step: 2
    batch_size: 8192 #16_384

local:
  device: cuda
  num_gpus: 8
  num_workers: 64 # total across GPUs (= 8 per GPU); scale with num_gpus
  runtime_limits:
    max_time_per_run: 1_000_000
    max_epochs_per_run: 500
  checkpoint_epochs: 25
  local_cache_path: /tmp
#  torch_compile: true  # Fuse the network kernels with torch.compile; see the multi-GPU guide.
  condor:
    memory_cpus: 256000
    memory_gpus: 80000
    num_cpus: 64
    request_disk: 800GB
